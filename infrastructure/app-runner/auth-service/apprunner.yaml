version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - npm install
    build:
      - npm run build
    post-build:
      - echo "Build completed"
run:
  command: npm run start:prod
  network:
    port: 3001
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "3001"
