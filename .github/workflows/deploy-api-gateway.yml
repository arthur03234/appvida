name: Deploy API Gateway to App Runner

on:
  push:
    branches:
      - main
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/deploy-api-gateway.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: appvida-api-gateway
  SERVICE_NAME: appvida-api-gateway

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/api-gateway
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create or Update App Runner Service
        run: |
          SERVICE_ARN=$(aws apprunner list-services --region ${{ env.AWS_REGION }} --query "ServiceSummaryList[?ServiceName=='${{ env.SERVICE_NAME }}'].ServiceArn" --output text)

          if [ -z "$SERVICE_ARN" ]; then
            echo "Creating new App Runner service..."
            aws apprunner create-service \
              --service-name ${{ env.SERVICE_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --source-configuration '{
                "ImageRepository": {
                  "ImageIdentifier": "${{ steps.build-image.outputs.image }}",
                  "ImageRepositoryType": "ECR",
                  "ImageConfiguration": {
                    "Port": "3000",
                    "RuntimeEnvironmentVariables": {
                      "NODE_ENV": "production",
                      "PORT": "3000",
                      "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
                      "MONGODB_URI": "${{ secrets.MONGODB_URI }}",
                      "AUTH_SERVICE_URL": "${{ secrets.AUTH_SERVICE_URL }}",
                      "USER_SERVICE_URL": "${{ secrets.USER_SERVICE_URL }}"
                    }
                  }
                },
                "AuthenticationConfiguration": {
                  "AccessRoleArn": "${{ secrets.APP_RUNNER_ROLE_ARN }}"
                }
              }' \
              --instance-configuration '{
                "Cpu": "1024",
                "Memory": "2048"
              }'
          else
            echo "Updating existing App Runner service..."
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --region ${{ env.AWS_REGION }} \
              --source-configuration '{
                "ImageRepository": {
                  "ImageIdentifier": "${{ steps.build-image.outputs.image }}",
                  "ImageRepositoryType": "ECR",
                  "ImageConfiguration": {
                    "Port": "3000",
                    "RuntimeEnvironmentVariables": {
                      "NODE_ENV": "production",
                      "PORT": "3000",
                      "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
                      "MONGODB_URI": "${{ secrets.MONGODB_URI }}",
                      "AUTH_SERVICE_URL": "${{ secrets.AUTH_SERVICE_URL }}",
                      "USER_SERVICE_URL": "${{ secrets.USER_SERVICE_URL }}"
                    }
                  }
                },
                "AuthenticationConfiguration": {
                  "AccessRoleArn": "${{ secrets.APP_RUNNER_ROLE_ARN }}"
                }
              }'
          fi

          echo "Waiting for service to become available..."
          aws apprunner wait service-running --service-arn "$SERVICE_ARN" --region ${{ env.AWS_REGION }} || true

          SERVICE_URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --region ${{ env.AWS_REGION }} --query "Service.ServiceUrl" --output text)
          echo "App Runner URL: https://$SERVICE_URL"
